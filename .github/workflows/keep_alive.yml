name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 8 */5 * *'  # every 5 days at 08:00 UTC
  workflow_dispatch:         # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "ERROR: SUPABASE_URL secret is empty or not set."
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_SERVICE_KEY }}" ]; then
            echo "ERROR: SUPABASE_SERVICE_KEY secret is empty or not set."
            exit 1
          fi
          echo "Secrets are present."
          echo "URL length: ${#SUPABASE_URL}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/upload_log?select=id&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}")
          echo "HTTP status: $response"
          if [ "$response" != "200" ]; then
            echo "Ping failed with status $response"
            exit 1
          fi
          echo "Supabase is alive."
