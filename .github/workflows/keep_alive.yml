name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 8 * * *'  # daily at 08:00 UTC — well inside Supabase's 7-day freeze window
  workflow_dispatch:       # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Validate secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "${SUPABASE_URL}" ]; then
            echo "ERROR: SUPABASE_URL secret is empty or not set."
            exit 1
          fi
          if [ -z "${SUPABASE_SERVICE_KEY}" ]; then
            echo "ERROR: SUPABASE_SERVICE_KEY secret is empty or not set."
            exit 1
          fi
          echo "Secrets are present."
          echo "URL length: ${#SUPABASE_URL}"

      # A read (SELECT) returns 200 but Supabase's inactivity scan does NOT count it as
      # "sufficient activity". We perform an actual WRITE (upsert into a dedicated
      # keep_alive table) so the project registers genuine database activity every day.
      # One-time setup required in the Supabase SQL editor — see db/keep_alive.sql.
      - name: Ping Supabase with a write (with retry)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt..."
            now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            response=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "${SUPABASE_URL}/rest/v1/keep_alive" \
              -H "apikey: ${SUPABASE_SERVICE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
              -H "Content-Type: application/json" \
              -H "Prefer: resolution=merge-duplicates,return=minimal" \
              -d "{\"id\":1,\"last_ping\":\"${now}\"}")
            echo "HTTP status: $response"
            # 201 = created, 204 = upsert with return=minimal, 200 = updated
            if [ "$response" = "201" ] || [ "$response" = "204" ] || [ "$response" = "200" ]; then
              echo "Supabase write succeeded — project registered as active."
              exit 0
            fi
            echo "Write failed with status $response — retrying in 30s..."
            sleep 30
          done
          echo "All 3 attempts failed. Check the keep_alive table exists (db/keep_alive.sql)"
          echo "and that the project is not already paused: https://supabase.com/dashboard"
          exit 1

      # Belt-and-suspenders: also touch a real app table. Supabase's pause scanner may
      # weigh activity on user-facing tables differently than a dedicated keep-alive
      # table. This is a read-only SELECT (no rows inserted/modified), so it can't
      # corrupt data shown in the dashboard the way writing to employees/upload_log would.
      - name: Read-only ping on employees table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/employees?select=id&limit=1" \
            -H "apikey: ${SUPABASE_SERVICE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}")
          echo "HTTP status: $response"
          if [ "$response" != "200" ]; then
            echo "Warning: employees ping returned $response (non-fatal, keep_alive write already succeeded)"
          fi
